<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="theme-color" content="#14120d"><script src="theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Strichliste – Bierwart</title><link rel="stylesheet" href="style.css">
</head><body class="kiosk">
<header class="app">
  <nav class="pagenav" aria-label="Kasse"><a id="tallyNav" href="strichliste.html" aria-current="page" class="area-link" aria-label="Strichliste" title="Strichliste"><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#tally-5"></use></svg><span class="area-caption">Strichliste</span></a>
    <a id="eventsNav" href="veranstaltung.html" class="area-link" aria-label="Veranstaltungen" title="Veranstaltungen"><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#calendar-days"></use></svg><span class="area-caption">Veranstaltungen</span></a></nav></header>
<main>
  <h1 class="page-title" id="pageTitle">Strichliste</h1>
  <div class="tally-toolbar">
    <input id="search" type="search" enterkeyhint="search" placeholder="Name suchen …" aria-label="Name suchen">
    <button class="btn gold icon-action" id="btnNew" disabled aria-label="Konto anlegen" title="Konto anlegen"><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#user-round-plus"></use></svg></button>
    <button class="btn" id="btnBarCard" hidden>Getränkekarte</button>
    <button class="btn" id="btnEventDrinks" disabled>Temporäre Getränke</button>
    <button class="btn" id="btnActiveMeal">Aktivenessen anlegen</button>
  </div>
  <div id="names" aria-label="Konten"><p class="muted" role="status">Konten werden geladen …</p></div>
</main>
<nav class="footer-nav" aria-label="Weitere Bereiche"><a href="user.html"><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#wallet"></use></svg>Mein Konto</a><a href="admin.html"><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#shield-check"></use></svg>Verwaltung</a></nav>

<dialog class="bw-dialog order-dialog" id="sheet" aria-labelledby="sheetName">
  <div class="dialog-head"><h2 id="sheetName"></h2><button class="btn small ghost" aria-label="Schließen" title="Schließen" data-close><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#x"></use></svg></button></div>
  <div class="tally" id="sheetTally"></div>
  <div class="drink-grid" id="sheetProducts"></div>
  <div class="order-bar"><span>Summe <strong id="sheetSum"></strong></span><div class="order-actions">
    <button class="btn" id="btnReset">Zurücksetzen</button><button class="btn gold" id="btnBook">Buchen</button>
  </div></div>
</dialog>
<dialog class="bw-dialog compact-dialog" id="newAccount" aria-labelledby="newTitle">
  <div class="dialog-head"><h2 id="newTitle">Konto anlegen</h2><button class="btn ghost small" aria-label="Schließen" title="Schließen" data-close><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#x"></use></svg></button></div>
  <form class="stack-form"><label>Name auf der Strichliste<input name="name" placeholder="z. B. Muster, Max" maxlength="120" required autocomplete="off"></label>
    <label>Nachname (Startpasswort)<input name="surname" placeholder="z. B. Muster" maxlength="120" required autocomplete="off"></label>
    <button class="btn gold" type="submit">Konto anlegen</button></form>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script src="/vendor/hyphen.js"></script><script src="/vendor/hyphen-de.js"></script>
<script src="display.js"></script><script src="ui.js"></script><script src="order.js"></script>
<script src="bar-types.js"></script><script src="bar-card.js"></script><script src="temporary-drinks.js"></script><script src="meal-allocation.js"></script><script src="active-meals.js"></script>
<script>
const $ = id => document.getElementById(id);
const eventId = new URLSearchParams(location.search).get("event");
let accounts = null, shared = [], currentEvent = null, current = null;
let loadNumber = 0;
const order = mountOrder({
  grid:$("sheetProducts"), sum:$("sheetSum"), tally:$("sheetTally"), reset:$("btnReset"), submit:$("btnBook"),
  book:items => BW.post("/api/purchase", {accountId:current.id, eventId:eventId || undefined, items}),
  onRejected:load,
  onBooked:async () => { modal.close(); BW.toast("Gebucht für " + current.name + "."); await load(); }
});
const modal = BW.dialog($("sheet"), () => !order.busy);
function openSheet(account) {
  current = account;
  order.clear();
  $("sheetName").textContent = wrapName(current.name);
  modal.open();
}
function renderNames() {
  if (!accounts) return;
  const q = $("search").value.trim().toLocaleLowerCase("de");
  const titles = {collective:"Sammelkonten", priority:"Priorisierte Konten", recent:"In den letzten 7 Tagen gebucht", other:"Weitere Konten"};
  $("names").textContent = "";
  let grid, currentGroup;
  for (const a of accounts) {
    if (q ? ![a.name, a.fullName].some(n => n && n.toLocaleLowerCase("de").includes(q)) : a.group === "other") continue;
    if (a.group !== currentGroup) {
      currentGroup = a.group;
      const section = document.createElement("section");
      section.className = "event-group";
      section.dataset.group = a.group;
      const heading = document.createElement("h3");
      heading.textContent = titles[a.group];
      grid = document.createElement("div");
      grid.className = "grid";
      section.append(heading, grid);
      $("names").append(section);
    }
    const b = document.createElement("button");
    b.className = "tile" + (a.group === "priority" ? " prio" : "");
    b.textContent = wrapName(a.name); b.onclick = () => openSheet(a);
    grid.append(b);
  }
  if (!grid) {
    const empty = document.createElement("p"); empty.className = "muted empty-state";
    empty.textContent = q ? "Kein passendes Konto gefunden." : "Keine Konten in der Vorauswahl. Über die Suche findest du alle Namen.";
    $("names").append(empty);
  }
}
async function load() {
  const number = ++loadNumber;
  const [names, products, drinks, events] = await Promise.all([
    BW.api("/api/tally/accounts" + (eventId ? "?event=" + encodeURIComponent(eventId) : "")),
    BW.api("/api/products"), BW.api("/api/temporary-drinks"), eventId ? BW.api("/api/events") : []
  ]);
  if (number !== loadNumber) return;
  currentEvent = events.find(e => e.id === eventId && e.mode === "personal") || null;
  if (eventId && !currentEvent) {
    accounts = []; $("btnBarCard").hidden = true; $("names").textContent = "Diese Veranstaltung ist nicht mehr verfügbar.";
    $("btnNew").disabled = $("btnEventDrinks").disabled = true;
    if (!order.busy) modal.close();
    throw Error("Diese Veranstaltungsstrichliste ist nicht verfügbar.");
  }
  shared = drinks;
  $("btnBarCard").hidden = !currentEvent;
  if (currentEvent) $("pageTitle").textContent = wrapName(currentEvent.name);
  const eventDrinks = currentEvent ? (currentEvent.customDrinks || []).concat(currentEvent.barDrinks || []) : [];
  order.setProducts(products.filter(p => p.tally).slice(0, 5).concat(shared, eventDrinks));
  accounts = names;
  $("btnNew").disabled = $("btnEventDrinks").disabled = false;
  renderNames();
}
$("search").oninput = renderNames;
const form = $("newAccount").querySelector("form");
const newModal = BW.dialog($("newAccount"), () => !form.querySelector("button").disabled);
$("btnNew").onclick = () => { form.reset(); newModal.open(); };
BW.mountAccountForm(form, async account => {
  $("newAccount").close(); BW.toast(account.name + " angelegt."); await load(); openSheet(account);
});
mountEventCard($("btnBarCard"), () => currentEvent, load);
mountTemporaryDrinks({trigger:$("btnEventDrinks"), reload:load, getShared:() => shared, getEvent:() => currentEvent});
if (eventId) {
  $("btnActiveMeal").hidden = true;
  $("pageTitle").textContent = "Veranstaltungsstrichliste";
  $("tallyNav").removeAttribute("aria-current"); $("eventsNav").setAttribute("aria-current", "page");
} else ActiveMeals.init({triggerId:"btnActiveMeal", toast:BW.toast, onCreated:() => load().catch(e => BW.toast(e.message))});
function refresh() {
  load().catch(error => {
    if (!accounts) BW.retryMessage($("names"),error.message,refresh);
    else BW.toast(error.message);
  });
}
refresh();
setInterval(() => {
  if (!document.hidden && !document.querySelector("dialog[open]"))
    refresh();
}, 30000);
</script></body></html>
