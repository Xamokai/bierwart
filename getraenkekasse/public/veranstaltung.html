<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="theme-color" content="#14120d"><script src="theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Veranstaltungen – Bierwart</title><link rel="stylesheet" href="style.css"></head>
<body class="kiosk">
<header class="app">
<nav class="pagenav" aria-label="Kasse"><a href="strichliste.html" class="area-link" aria-label="Strichliste" title="Strichliste"><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#tally-5"></use></svg><span class="area-caption">Strichliste</span></a><a href="veranstaltung.html" aria-current="page" class="area-link" aria-label="Veranstaltungen" title="Veranstaltungen"><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#calendar-days"></use></svg><span class="area-caption">Veranstaltungen</span></a></nav></header>
<main><section id="pick">
  <div class="section-head"><h1 class="page-title">Veranstaltungen</h1><button class="btn gold" id="btnNewEv" hidden>Termin anlegen</button></div>
  <p id="calendarStatus" class="muted" role="status" hidden></p>
  <div id="events"><p role="status">Veranstaltungen werden geladen …</p></div>
</section>
<section id="book" hidden>
  <div class="section-head"><div><h1 class="page-title" id="evName"></h1><div class="tally" id="evTally"></div></div>
    <div class="row"><button class="btn" id="btnBarCard">Getränkekarte</button><button class="btn" id="btnEventDrinks">Temporäre Getränke</button></div></div>
  <div class="drink-grid" id="prodGrid"></div>
  <div class="order-bar"><span>Summe <strong id="evSum"></strong></span><div class="order-actions">
    <button class="btn" id="btnReset">Zurücksetzen</button><button class="btn gold" id="btnBook">Buchen</button>
  </div></div>
  <a class="back-link" href="veranstaltung.html">← Andere Veranstaltung</a>
</section></main>
<nav class="footer-nav" aria-label="Weitere Bereiche"><a href="user.html"><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#wallet"></use></svg>Mein Konto</a><a href="admin.html"><svg class="nav-icon" aria-hidden="true" focusable="false"><use xlink:href="icons/navigation.svg#shield-check"></use></svg>Verwaltung</a></nav>
<div class="toast" id="toast" role="status"></div>
<script src="/vendor/hyphen.js"></script><script src="/vendor/hyphen-de.js"></script>
<script src="display.js"></script><script src="ui.js"></script><script src="event-form.js"></script><script src="order.js"></script><script src="bar-types.js"></script><script src="bar-card.js"></script><script src="temporary-drinks.js"></script>
<script>
const $ = id => document.getElementById(id);
let eventId = new URLSearchParams(location.search).get("event");
let shared = [], current = null;
const headers = () => ({Authorization:"Bearer " + (localStorage.getItem("kasse_token") || "")});
const eventUrl = e => (e.mode === "personal" ? "strichliste.html" : "veranstaltung.html") + "?event=" + encodeURIComponent(e.id);
const order = mountOrder({
  grid:$("prodGrid"), sum:$("evSum"), tally:$("evTally"), reset:$("btnReset"), submit:$("btnBook"),
  book:items => BW.post("/api/purchase", {accountId:current.id, items}),
  onBooked:async () => { BW.toast("Gebucht auf " + current.name + "."); await load(); }, onRejected:load
});
const format = options => new Intl.DateTimeFormat("de-DE", Object.assign({timeZone:"Europe/Berlin"},options));
const year = format({year:"numeric"}), month = format({month:"short"}), day = format({day:"2-digit"}), clock = format({hour:"2-digit",minute:"2-digit"}), fullDate = format({day:"numeric",month:"short",year:"numeric"});
function renderEventGroups(events) {
  const container = $("events"), past = container.querySelector("details"), expanded = past && past.open;
  container.textContent = "";
  for (const [status,title] of [["active","Jetzt buchbar"],["upcoming","Demnächst"],["past","Vergangene Termine"]]) {
    const entries = events.filter(e=>e.status===status);
    if (!entries.length) continue;
    const archived = status==="past", active = status==="active";
    const group = document.createElement(archived ? "details" : "section");
    group.className = "calendar-group";
    if (archived) { entries.reverse(); group.open = !!expanded; }
    const heading = document.createElement(archived ? "summary" : "h2");
    heading.textContent = title + (archived ? " ("+entries.length+")" : "");
    const list = document.createElement("div"); list.className = "calendar-list";
    for (const e of entries) {
      const start = new Date(e.startsAt), end = new Date(e.endsAt), last = new Date(end-1);
      const row = document.createElement(active ? "a" : "div");
      row.className = "event-tile calendar-entry" + (active ? " bookable" : "");
      if (active) row.href = eventUrl(e);
      const stamp = document.createElement("time"); stamp.className = "calendar-date"; stamp.dateTime = e.startsAt; stamp.setAttribute("aria-label",fullDate.format(start));
      const num = document.createElement("b"), mon = document.createElement("small");
      num.textContent = day.format(start); mon.textContent = month.format(start)+(year.format(start)!==year.format(new Date()) ? " "+year.format(start) : ""); stamp.append(num,mon);
      const info = document.createElement("div"), name = document.createElement("strong"), note = document.createElement("small");
      name.textContent = wrapName(e.name);
      const range = fullDate.format(start)!==fullDate.format(last);
      const times = e.allDay ? (range ? "Bis "+fullDate.format(last) : "Ganztägig") :
        clock.format(start)+" – "+(range ? fullDate.format(end)+", " : "")+clock.format(end)+" Uhr";
      note.textContent = times + (active ? (e.mode==="direct" ? " · Veranstaltungskonto" : " · Personenkonten") : "");
      info.append(name,note); row.append(stamp,info);
      if (active) {
        const arrow = document.createElement("span"); arrow.textContent = "→"; arrow.setAttribute("aria-hidden","true"); row.append(arrow);
      }
      list.append(row);
    }
    group.append(heading,list); container.append(group);
  }
  if (!events.length) container.textContent = "Für dieses Semester sind noch keine Termine eingetragen.";
}
let loadNumber = 0, loadingTimer;
async function load() {
  const number = ++loadNumber;
  const [plan,events,products,drinks] = await Promise.all([
    BW.api("/api/events/calendar",{headers:headers(),cache:"no-store"}), eventId ? BW.api("/api/events") : [],
    eventId ? BW.api("/api/products") : [], eventId ? BW.api("/api/temporary-drinks") : []
  ]);
  if (number !== loadNumber) return;
  shared = drinks;
  clearTimeout(loadingTimer);
  if (plan.loading && !plan.syncedAt && !eventId) loadingTimer = setTimeout(refreshEvents,2000);
  $("btnNewEv").hidden = !plan.canCreate;
  $("calendarStatus").hidden = !(plan.error || plan.loading);
  $("calendarStatus").textContent = plan.error ? (plan.syncedAt ? "Semesterprogramm offline · Stand "+fullDate.format(new Date(plan.syncedAt)) : "Semesterprogramm derzeit nicht erreichbar.") : "Semesterprogramm wird geladen …";
  current = events.find(e=>e.id===eventId);
  if (current && current.mode === "personal") { location.replace(eventUrl(current)); return; }
  $("pick").hidden = !!current; $("book").hidden = !current;
  if (current) {
    $("evName").textContent = wrapName(current.name);
    order.setProducts(products.concat(shared, current.customDrinks || [], current.barDrinks || []));
  } else {
    renderEventGroups(plan.entries);
    if (plan.loading && !plan.entries.length) $("events").textContent = "";
    if (eventId) { eventId = null; history.replaceState(null, "", "veranstaltung.html"); BW.toast("Für diesen Termin ist die Buchung geschlossen."); }
  }
}
mountEventCard($("btnBarCard"), () => current, load);
mountTemporaryDrinks({trigger:$("btnEventDrinks"), reload:load, getShared:() => shared, getEvent:() => current});
mountEventForm($("btnNewEv"),headers,load);
function refreshEvents() {
  load().catch(e => BW.retryMessage($("events"),e.message,refreshEvents));
}
refreshEvents();
setInterval(() => {
  if (!document.hidden && !order.busy && !order.selected && !document.querySelector("dialog[open]"))
    load().catch(e => BW.toast(e.message));
}, 30000);
</script></body></html>
