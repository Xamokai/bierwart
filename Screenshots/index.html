<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bierwart · Screenshots und Druckbeispiele</title><link rel="stylesheet" href="Druck/vorschau.css"><link rel="icon" href="data:,">
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;color:#221f18;background:#faf8f3;--panel:#fff;--line:#938b78;--link:#806013}
@media(prefers-color-scheme:dark){:root{color:#f3efe6;background:#191816;--panel:#25231f;--line:#8d8576;--link:#e3bf69}}
*{box-sizing:border-box}body{max-width:76rem;margin:auto;padding:1.5rem}h1,h2{font-family:Georgia,serif;font-weight:400}h1{margin:0;font-size:2.2rem}h2{margin:1.6rem 0 .6rem}small{font:500 .85rem system-ui}
a{color:var(--link)}nav{display:flex;flex-wrap:wrap;gap:1rem;align-items:end;border-block:1px solid var(--line);padding:1rem 0}[hidden]{display:none!important}label{display:grid;gap:.25rem}select{background:var(--panel);color:inherit;border:1px solid var(--line);padding:.45rem;min-height:44px;font:inherit;max-width:100%}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}figure{margin:0;background:var(--panel);border:1px solid var(--line);padding:.6rem;border-radius:7px;text-align:center}figcaption{text-align:left;margin-bottom:.5rem;font-weight:600}figure img{display:block;width:auto;height:auto;max-width:100%;max-height:72vh;margin:auto}a:focus-visible,select:focus-visible{outline:3px solid var(--link);outline-offset:2px}@media(max-width:540px){body{padding:.8rem}.pair{gap:.4rem}figure{padding:.25rem}}
</style></head><body>
<h1>Oberfläche im Vergleich</h1><p>Lokale Testdaten. Größen in CSS-Pixeln. Ein Klick auf die Aufnahme öffnet das PNG in Originalgröße.</p>
<nav aria-label="Bildauswahl"><label>Ansicht<select id="view"></select></label><label>Gerät<select id="device"><option>Alle Geräte</option></select></label><a href="#druck">Druckbeispiele ansehen</a></nav>
<main><div id="gallery"></div><section id="druck" aria-label="Druckbeispiele" hidden></section></main><noscript>Die PNG-Dateien liegen nach Gerät, Hell und Dunkel sortiert neben dieser Datei.</noscript>
<script src="Druck/vorschau.js"></script><script src="galerie.js"></script></body></html>
